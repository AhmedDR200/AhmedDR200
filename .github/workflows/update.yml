name: Update profile stats

on:
  schedule:
    - cron: "0 3 * * *"      # every day at 03:00 UTC
  workflow_dispatch:          # lets you run it manually from the Actions tab
  push:
    branches: [main]
    paths: ["scripts/generate.py", "assets/portrait.txt"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate SVGs
        env:
          # Add a PAT named GH_STATS_TOKEN (scope: read:user) to count private contributions too.
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN || github.token }}
        run: python scripts/generate.py "${{ github.repository_owner }}"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --cached --quiet || git commit -m "chore: update profile stats"
          git push
