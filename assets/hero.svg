<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290" viewBox="0 0 880 290">
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.fade{animation:fade .5s ease-out both}
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.on{opacity:0;animation:on linear}
.blink{opacity:0;animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes on{from,to{opacity:1}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.cover{display:none}}
@keyframes t0{to{transform:translateX(54.0px)}}@keyframes t1{to{transform:translateX(277.2px)}}@keyframes t2{to{transform:translateX(117.0px)}}</style>
